<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Insight Center — A practice for the development of mind</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Insight Center for Cognitive Development exists to cultivate the foundational capacities that underpin lifelong learning and human flourishing.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://insightcenter.org/landing">
<meta property="og:title" content="The Insight Center for Cognitive Development">
<meta property="og:description" content="Cultivating the foundational capacities that underpin lifelong learning and human flourishing.">
<meta property="og:image" content="https://insightcenter.org/brand_assets/about-hero.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://insightcenter.org/brand_assets/about-hero.jpg">
<link rel="icon" href="brand_assets/Logos/SVG/InsightCenter_Icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mint-light: #98d4c3;
    --teal-dark:  #103f3a;
    --font-serif: 'DM Serif Display', Georgia, serif;
    --font-sans:  'Outfit', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--teal-dark); overflow-x: hidden; }

  /* ── Hero ── */
  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image: url('brand_assets/about-hero.jpg');
    background-size: cover;
    background-position: center top;
    overflow: hidden;
    isolation: isolate;
  }
  @media (min-width: 641px) and (max-width: 1024px) {
    .hero { background-position: 85% top; }
  }
  @media (max-width: 640px) {
    .hero {
      background-image: url('brand_assets/hero_boy_mobile.jpg');
      align-items: flex-start;
      justify-content: center;
    }
  }

  /* Overlays */
  .hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(90deg,
      rgba(16,63,58,0.88) 0%,
      rgba(16,63,58,0.72) 20%,
      rgba(16,63,58,0.35) 38%,
      rgba(16,63,58,0) 52%,
      rgba(16,63,58,0) 100%);
    pointer-events: none;
  }
  .hero-vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 120% 100% at 20% 50%, transparent 45%, rgba(4,14,12,0.45) 100%);
    pointer-events: none;
  }
  @media (max-width: 640px) {
    .hero-overlay {
      background: linear-gradient(to bottom,
        rgba(16,63,58,0.92) 0%,
        rgba(16,63,58,0.65) 30%,
        rgba(16,63,58,0.2) 55%,
        rgba(16,63,58,0) 70%);
    }
    .hero-vignette { display: none; }
  }
  .hero-fade-bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 150px;
    background: linear-gradient(to bottom, transparent, rgba(6,18,15,0.65));
    pointer-events: none;
  }

  /* Top fade for logo legibility */
  .hero-fade-top {
    position: absolute; top: 0; left: 0; right: 0;
    height: 180px;
    background: linear-gradient(to bottom, rgba(6,18,15,0.55), transparent);
    pointer-events: none;
    z-index: 3;
  }

  /* Brand bar */
  .brand-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 4;
    padding: 28px 40px;
    display: flex;
    align-items: center;
    pointer-events: none;
  }
  .brand-bar img { height: 40px; pointer-events: auto; }
  @media (max-width: 640px) {
    .brand-bar { padding: 20px 24px; }
    .brand-bar img { height: 32px; }
  }

  /* Content */
  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 clamp(1.5rem, 5vw, 4rem);
    max-width: 1152px;
    width: 100%;
    transition: opacity 0.7s ease, transform 0.7s ease, visibility 0.7s;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  @media (max-width: 1024px) {
    .hero-content { padding-top: 18vh; }
    .hero { align-items: flex-start; }
  }
  @media (max-width: 640px) {
    .hero-content { padding-top: 14vh; }
  }

  .lede {
    font-family: var(--font-serif);
    font-size: clamp(1.375rem, 2.6vw, 2.5rem);
    line-height: 1.35;
    letter-spacing: -0.015em;
    color: #fff;
    margin: 0;
    max-width: 1000px;
    text-wrap: balance;
    text-shadow: 0 2px 24px rgba(0,0,0,0.28);
  }
  .lede em {
    font-style: italic;
    color: var(--mint-light);
  }

  .watch-cue {
    margin-top: clamp(2.5rem, 5vw, 5rem);
    font-size: clamp(1rem, 1.6vw, 1.375rem);
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.9);
    display: flex;
    align-items: center;
    gap: 1.25rem;
  }

  /* Play button */
  .play-button {
    --size: clamp(64px, 6.5vw, 88px);
    margin-top: 0;
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    background: rgba(152,212,195,0.1);
    border: 1.5px solid rgba(152,212,195,0.75);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: transform 0.3s cubic-bezier(0.22,1,0.36,1),
                background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
    appearance: none;
    padding: 0;
    outline: none;
    flex-shrink: 0;
  }
  .play-button::before,
  .play-button::after {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1px solid rgba(152,212,195,0.25);
    animation: pulse 2.6s cubic-bezier(0.22,1,0.36,1) infinite;
    pointer-events: none;
  }
  .play-button::after {
    border-color: rgba(152,212,195,0.15);
    animation-delay: 1.3s;
  }
  @keyframes pulse {
    0%   { transform: scale(1);   opacity: 0.8; }
    70%  { transform: scale(1.4); opacity: 0; }
    100% { transform: scale(1.4); opacity: 0; }
  }
  .play-button:hover {
    transform: scale(1.06);
    background: rgba(152,212,195,0.2);
    border-color: rgba(152,212,195,1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .play-button:active { transform: scale(0.98); }
  .play-button svg {
    width: clamp(22px, 2.4vw, 30px);
    height: clamp(22px, 2.4vw, 30px);
    transform: translateX(2px);
  }

  /* Vimeo iframe */
  .hero-video {
    position: absolute; inset: 0; z-index: 1;
    width: 100%; height: 100%;
    border: 0; opacity: 0; pointer-events: none;
    transition: opacity 1s cubic-bezier(0.22,1,0.36,1);
  }

  /* Playing state */
  .hero.is-playing .hero-content   { opacity: 0; transform: translateY(-12px); visibility: hidden; pointer-events: none; }
  .hero.is-playing .hero-overlay,
  .hero.is-playing .hero-vignette  { opacity: 0; transition: opacity 0.8s ease; }
  .hero.is-playing .hero-video     { opacity: 1; pointer-events: auto; }
  .hero.is-playing .brand-bar      { opacity: 0; transition: opacity 0.6s ease; pointer-events: none; }
  .hero.is-playing .video-controls { opacity: 1; transform: translateY(0); pointer-events: auto; }

  /* Back control */
  .video-controls {
    position: absolute; top: 28px; right: 80px; z-index: 5;
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity 0.6s ease 0.4s, transform 0.6s ease 0.4s;
  }
  .ctrl {
    appearance: none;
    background: rgba(16,63,58,0.6);
    border: 1px solid rgba(255,255,255,0.22);
    color: #fff;
    padding: 9px 14px;
    border-radius: 100px;
    font-family: var(--font-sans);
    font-size: 12px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    cursor: pointer; backdrop-filter: blur(8px);
    display: inline-flex; align-items: center; gap: 8px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .ctrl:hover { background: rgba(16,63,58,0.85); border-color: rgba(255,255,255,0.45); }
  .ctrl svg { width: 14px; height: 14px; }

  /* Reveal */
  .reveal { opacity: 0; transform: translateY(16px); animation: rise 1.1s cubic-bezier(0.22,1,0.36,1) forwards; }
  .reveal-1 { animation-delay: 0.2s; }
  .reveal-2 { animation-delay: 0.45s; }
  .reveal-3 { animation-delay: 0.7s; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .play-button::before, .play-button::after { animation: none; }
    .reveal { animation-duration: 0.4s; }
  }
</style>
</head>
<body>

<section class="hero" id="hero" aria-labelledby="hero-lede">
  <div class="hero-overlay"></div>
  <div class="hero-vignette"></div>
  <div class="hero-fade-top"></div>
  <div class="hero-fade-bottom"></div>

  <header class="brand-bar reveal reveal-1">
    <img src="brand_assets/Logos/SVG/InsightCenter_Horizontal_Reverse.svg" alt="The Insight Center for Cognitive Development">
  </header>

  <iframe class="hero-video" id="vimeo" src="" data-src="https://player.vimeo.com/video/1189799250?autoplay=1&title=0&byline=0&portrait=0&dnt=1" title="The Insight Center" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>

  <div class="hero-content" id="hero-content">
    <p class="lede reveal reveal-2" id="hero-lede">
      The Insight Center for Cognitive Development exists to cultivate the foundational capacities that underpin <em>lifelong learning</em> and <em>human flourishing</em>.
    </p>

    <div class="watch-cue reveal reveal-3">
      <button class="play-button" id="play-btn" aria-label="Play introduction video" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M5 3.5v17a1 1 0 0 0 1.55.83l13-8.5a1 1 0 0 0 0-1.66l-13-8.5A1 1 0 0 0 5 3.5z"/>
        </svg>
      </button>
      Watch to learn more
    </div>
  </div>

  <div class="video-controls" aria-hidden="true">
    <button class="ctrl" id="back-btn" type="button" aria-label="Return to hero">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13 8H3M7 4L3 8l4 4"/>
      </svg>
      Back
    </button>
  </div>
</section>

<script>
  (function () {
    const hero    = document.getElementById('hero');
    const playBtn = document.getElementById('play-btn');
    const backBtn = document.getElementById('back-btn');
    const iframe  = document.getElementById('vimeo');

    function play() {
      if (hero.classList.contains('is-playing')) return;
      if (!iframe.getAttribute('src')) iframe.setAttribute('src', iframe.dataset.src);
      hero.classList.add('is-playing');
    }
    function back() {
      hero.classList.remove('is-playing');
      iframe.removeAttribute('src');
    }

    playBtn.addEventListener('click', play);
    backBtn.addEventListener('click', back);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') back(); });
  })();
</script>

</body>
</html>
